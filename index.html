<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./pokemon.js" defer></script>
    <script src="./search.js" defer></script>
  </head>

<!-- This is the HTML FOR THE LIST OF POKEMON -->


<!-- header -->

<body>
<main class="main">
  <header class="header home">
<div class="container">
  <div class="logo-wrapper">
    <img src="./assets/pokemonletters.svg" alt="pokemonletters" />
    <h1>Pokédex <br> powered by:PokémonApi</h1>
  </div>

<div class="search-wrapper">
<div class="search-wrap">
<img
  src="./assets/search.svg"
  alt="search icon"
  class="search-icon"
/>
<input
  type="text"
  class="search-input body3-fonts"
  placeholder="Search"
  id="search-input"
/>
<img
  src="./assets/cross.svg"
  alt="cross icon"
  class="search-close-icon"
  id="search-close-icon"
/>
</div>
<div class="sort-wrapper">
<div class="sort-wrap">
  <img
    src="./assets/sorting.svg"
    alt="sorting"
    class="sort-icon"
    id="sort-icon"
  />
</div>
<div class="filter-wrapper">
  <p class="body2-fonts">Sort by:</p>
  <div class="filter-wrap">
    <div>
      <input
        type="radio"
        id="number"
        name="filters"
        value="number"
        checked
      />
      <label for="number" class="body3-fonts">Number</label>
    </div>
    <div>
      <input type="radio" id="name" name="filters" value="name" />
      <label for="name" class="body3-fonts">Name</label>
    </div>
    <div>
      <input type="radio" id="type" name="filters" value="type" />
      <label for="type" class="body3-fonts">Type</label>
    </div>
  </div>
</div>
</div>
</div>
</div>
</header>

<!-- pokemon list container -->

<section class="pokemon-list">
<div class="container">
  <div class="list-wrapper"></div>
</div>
    <div id="not-found-message">Pokemon not found</div>
  </section>

  <!-- footer -->

<footer>
<div class="footer-container">
<h4> Powered by: PokemonApi</h4>
</div>
</footer>

<div id="loader" class="loader"></div>
<div id="content" class="hidden"></div>

</main>
</body>
</html>
